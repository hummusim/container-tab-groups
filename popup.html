<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Containers as Tab Groups</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1c1b22;
        --muted: rgba(28, 27, 34, 0.6);
        --border: rgba(0, 0, 0, 0.1);
        --hover: rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2b2a33;
          --fg: #fbfbfe;
          --muted: rgba(251, 251, 254, 0.6);
          --border: rgba(255, 255, 255, 0.1);
          --hover: rgba(255, 255, 255, 0.08);
        }
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 320px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: var(--fg);
        background: var(--bg);
      }
      .section-title {
        padding: 12px 16px 6px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
      }
      .empty {
        padding: 18px 16px 22px;
        text-align: center;
        color: var(--muted);
      }
      .track {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-top: 1px solid var(--border);
      }
      .track:first-of-type {
        border-top: none;
      }
      .info {
        flex: 1;
        min-width: 0;
      }
      .container-chip {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 9px;
        font-size: 10.5px;
        font-weight: 600;
        color: #fff;
        margin-bottom: 4px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .title {
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .controls {
        display: flex;
        gap: 2px;
      }
      .icon-btn {
        width: 28px;
        height: 28px;
        border: none;
        background: transparent;
        cursor: pointer;
        border-radius: 4px;
        color: inherit;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      .icon-btn:hover {
        background: var(--hover);
      }
      .icon-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .footer {
        padding: 10px 14px;
        border-top: 1px solid var(--border);
      }
      .footer button {
        width: 100%;
        padding: 7px 10px;
        font-size: 13px;
        border: 1px solid var(--border);
        background: transparent;
        border-radius: 5px;
        cursor: pointer;
        color: inherit;
      }
      .footer button:hover {
        background: var(--hover);
      }
    </style>
  </head>
  <body>
    <div class="section-title">Now playing</div>
    <div id="tracks"></div>
    <div class="footer">
      <button id="regroup">Re-group all tabs by container</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
