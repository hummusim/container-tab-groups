<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Container Tab Groups - Options</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 16px;
        font-size: 13px;
        color: #1c1b22;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      button {
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
      }
      .row {
        margin-top: 12px;
      }
      .hint {
        color: #5b5b66;
        margin-top: 8px;
      }
      #status {
        margin-top: 10px;
        color: #126312;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Container Tab Groups</h1>
    <p class="hint">
      Tabs are grouped automatically by their Multi-Account Container. You can re-run the grouping
      pass at any time:
    </p>
    <div class="row">
      <button id="regroup">Re-group all tabs now</button>
      <button id="reset">Forget cached group mapping</button>
    </div>

    <div class="row">
      <label>
        <input type="checkbox" id="autoCollapse" />
        Auto-collapse inactive container groups
      </label>
      <div class="hint">
        When you activate a tab, its container's group stays expanded and the rest collapse, so only
        the active "profile" is visible.
      </div>
    </div>

    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
